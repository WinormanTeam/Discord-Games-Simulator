name: Analyze & Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu — быстрый контур, Windows — среда, близкая к целевой.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run unit tests
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  analyze:
    name: PSScriptAnalyzer + parser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze
        run: |
          # Предупреждения печатаем и складываем в summary, но блокируем PR
          # только на ошибках: стилевые замечания не должны останавливать работу.
          $warnings = @(Invoke-ScriptAnalyzer -Path . -Recurse `
              -Settings ./PSScriptAnalyzerSettings.psd1 `
              -Severity Warning)

          # Печатаем всё в лог: без этого невозможно понять, что именно чинить.
          $warnings |
            Select-Object RuleName, Severity, Line, Column, Message, ScriptName |
            Sort-Object ScriptName, Line |
            Format-Table -AutoSize -Wrap |
            Out-String -Width 200 |
            Write-Host

          # И в Job Summary, чтобы отчёт был виден прямо в PR.
          $summary = "`n### PSScriptAnalyzer: $($warnings.Count) замечаний`n`n" +
            (($warnings | Group-Object RuleName |
              ForEach-Object { "- **$($_.Name)** — $($_.Count)" }) -join "`n")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary

          # Блокирующий гейт — только ошибки уровня Error.
          $errors = @(Invoke-ScriptAnalyzer -Path . -Recurse `
              -Settings ./PSScriptAnalyzerSettings.psd1 `
              -Severity Error)
          foreach ($e in $errors) {
            Write-Host ("::error file={0},line={1},col={2}::{3} ({4})" -f `
                $e.ScriptName, $e.Line, $e.Column, $e.Message, $e.RuleName)
          }
          Write-Host "Ошибок: $($errors.Count); предупреждений: $($warnings.Count)"
          if ($errors.Count -gt 0) { exit 1 }

      - name: Syntax check (native parser)
        run: |
          $failed = 0
          $files = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1 |
            Where-Object { $_.FullName -notlike '*\node_modules\*' }
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Host ("::error file={0}::{1}" -f $file.FullName, $errors[0].Message)
            }
          }
          if ($failed -gt 0) { exit 1 }
          Write-Host "Проверено файлов: $($files.Count)"

  smoke:
    name: Smoke test (-PrepareOnly)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare files only (windows are NOT launched)
        timeout-minutes: 5
        run: |
          # Сеть в CI может быть недоступна: скрипт обязан завершиться
          # контролируемо (0 или 1), а не зависнуть.
          # '& ' обязателен: `exit` внутри .ps1 иначе завершит весь шаг.
          & .\Run-Simulator.ps1 -Count 3 -Seconds 5 -PrepareOnly -Language en
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          # 0 — подготовка удалась; 1 — нет сети/каталога (в CI допустимо).
          if ($code -ne 0 -and $code -ne 1) { exit 1 }
          Get-ChildItem -Path .\simulator-data -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: simulator-data/logs/**
          if-no-files-found: ignore
